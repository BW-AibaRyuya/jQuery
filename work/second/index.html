<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>jQuery</title>
    <link rel="stylesheet" href="../../common/css/reset.css">
    <link rel="stylesheet" href="../../common/css/base.css">
    <link rel="stylesheet" href="./css/style.css">
    <style>
      .clearfix:after {
        display: block;
        clear: both;
        content: '';
      }
      .wrapper {
        padding: 20px;
      }
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, .7);
        display: none;
      }
      .modal-content {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 300px;
        height: 300px;
        margin: -150px 0 0 -150px;
        background-color: #fff;
        border-radius: 20px;
      }
      .modal-text {
        display: table-cell;
        width: 300px;
        height: 300px;
        text-align: center;
        vertical-align: middle;
      }
      .modal-close {
        position: absolute;
        top: -10px;
        right: -10px;
        width: 30px;
        height: 30px;
        color: #999;
        font-weight: bold;
        border: 2px #999 solid;
        border-radius: 15px;
        background-color: #fff;
        cursor: pointer;
        box-sizing: border-box;
      }
      .modal-show {
        display: inline-block;
        padding: 5px 10px;
        margin: 50px;
        color: #999;
        border-radius: 10px;
        border: 1px #999 solid;
        background-color: #fff;
        cursor: pointer;
      }
  </style>
  </head>
  <body>
    <div class="wrapper">
      <p class="modal-show">Click</p>
      <div class="modal" style="display: none;">
        <div class="modal-content">
          <div class="modal-text">MODAL WINDOW</div>
          <button type="button" class="modal-close">x</button>
        </div>
      </div>
    </div>
    <script src="../../common/js/jquery.js"></script>
    <script>
    $(function() {
     $('.modal-show').click(function() {
      $('.modal').fadeIn();
    });

    $('.modal-close').click(function() {
     $('.modal').fadeOut();
    });
    });
      // 今回やるのはモーダルです。
      // .modal-show をクリックすることで .modal をfadeInさせる。
      // .modal-close をクリックで .modal をfadeOutさせる。
      // .click() クリック時のイベントを登録する。
      // .fadeIn() 一定時間かけてフェードインする。
      // .fadeOut() 一定時間かけてフェードアウトする。
    </script>
  </body>
</html>
