<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
  $(function() {

  let failHtml =
  `
    <p class="text">逃げられてしまった...</p>
    <button class="btn mt" data-js="reset">戻る</button>
  `;

  let encountHtml =
  `
    <p class="name"></p>
    <div>
      <img class="img" src="" alt="">
    </div>
    <div>
      <button class="btn" id="catch">捕まえる</button>
      <button class="btn" data-js="reset">逃げる</button>
    </div>
  `;

  const $wrapper = $('#wrapper');

  // 「ポケモンを探す」
  $wrapper.on('click', '#pokemon_search', function() {
    let randomId = Math.floor(Math.random() * 151) + 1;

    $.ajax({
      url: `https://pokeapi.co/api/v2/pokemon/${randomId}`,
      method: 'GET'
    })
    .done(function(res) {
      $wrapper.html(encountHtml);
      $wrapper.find('.img').attr('src', res.sprites.front_default);

      // 日本語名取得
      $.ajax({
        url: res.species.url,
        method: 'GET'
      })
      .done(function(species) {
        let nameJa = species.names.find(n => n.language.name === 'ja').name;
        $wrapper.find('.name').text(nameJa);
      });
    })
    .fail(function(err) {
      console.error('取得失敗', err);
    });
  });

  // 捕まえる
  $wrapper.on('click', '#catch', function() {
    if (Math.random() < 0.5) {
      // 成功 → モンスターボールをAPIで取得
      $.ajax({
        url: 'https://pokeapi.co/api/v2/item/4', // モンスターボール
        method: 'GET'
      }).done(function(res) {
        let ballImgUrl = res.sprites.default; // モンスターボールの画像URL
        $wrapper.html(`
          <p class="name">ゲットしました</p>
          <div>
            <img class="img" src="${ballImgUrl}" alt="Pokeball">
          </div>
          <button class="btn" data-js="reset">戻る</button>
        `);
      }).fail(function(err) {
        console.error('モンスターボール取得失敗', err);
      });
    } else {
      $wrapper.html(failHtml);
    }
  });

  // 逃げる
  $wrapper.on('click', '[data-js="reset"]', function() {
    $wrapper.html('<button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>');
  });

});  
    // 回答はここに書いてね
  </script>
</body>
</html>
